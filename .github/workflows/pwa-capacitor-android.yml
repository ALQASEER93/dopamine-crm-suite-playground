name: PWA - Capacitor Android (Build Only)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ALQASEER-PWA
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ALQASEER-PWA/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble debug
        run: cd android && ./gradlew assembleDebug
