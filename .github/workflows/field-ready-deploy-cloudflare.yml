name: Field-Ready Deploy (Cloudflare)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-pwa-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets
        id: secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PROJECT_NAME; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deploy when secrets are missing
        if: steps.secrets.outputs.should_deploy != 'true'
        run: |
          echo "Field-Ready Cloudflare deploy skipped: missing required secrets."
          echo "Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PROJECT_NAME."
          {
            echo "## Field-Ready Cloudflare Deploy"
            echo ""
            echo "- Result: Skipped safely"
            echo "- Reason: Missing one or more required secrets"
            echo "- Required: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PROJECT_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        if: steps.secrets.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        if: steps.secrets.outputs.should_deploy == 'true'
        working-directory: ALQASEER-PWA
        run: npm ci

      - name: Build PWA
        if: steps.secrets.outputs.should_deploy == 'true'
        working-directory: ALQASEER-PWA
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.should_deploy == 'true'
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/cloudflare_deploy_output.log"
          npx wrangler@4 pages deploy ALQASEER-PWA/dist --project-name "$CLOUDFLARE_PROJECT_NAME" 2>&1 | tee "$output_file"
          deploy_url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\\.pages\\.dev' "$output_file" | tail -n 1 || true)"
          if [ -z "$deploy_url" ]; then
            echo "Could not extract deploy URL from wrangler output"
            exit 1
          fi
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"

      - name: Smoke check deployed URL
        if: steps.secrets.outputs.should_deploy == 'true'
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          curl -fsSLI "$DEPLOY_URL" >/dev/null
          curl -fsSLI "$DEPLOY_URL/login" >/dev/null
          {
            echo "## Field-Ready Cloudflare Deploy"
            echo ""
            echo "- Result: Success"
            echo "- URL: $DEPLOY_URL"
            echo "- Smoke: Passed (`/` and `/login` reachable)"
          } >> "$GITHUB_STEP_SUMMARY"
