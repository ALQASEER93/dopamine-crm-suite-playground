name: Field-Ready Deploy (Cloudflare)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-pwa-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve project name and check required secrets (fail-fast)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Cloudflare Pages deploy blocked: required secrets are missing."
            echo "Required: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          repo_name="${GITHUB_REPOSITORY##*/}"
          resolved_project_name="${CLOUDFLARE_PROJECT_NAME:-$repo_name}"
          if [ -z "$resolved_project_name" ]; then
            echo "Unable to resolve Cloudflare project name."
            echo "Provide CLOUDFLARE_PROJECT_NAME or ensure GITHUB_REPOSITORY is available."
            exit 1
          fi
          echo "CLOUDFLARE_PROJECT_NAME_RESOLVED=$resolved_project_name" >> "$GITHUB_ENV"
          echo "Resolved Cloudflare Pages project: $resolved_project_name"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        working-directory: ALQASEER-PWA
        run: npm ci

      - name: Build PWA
        working-directory: ALQASEER-PWA
        run: npm run build

      - name: Verify build output exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "ALQASEER-PWA/dist" ]; then
            echo "Build output missing: ALQASEER-PWA/dist"
            echo "Run the PWA build first and ensure dist/ is produced."
            exit 1
          fi

      - name: Prepare CI log paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/_ci_logs/cloudflare

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME_RESOLVED: ${{ env.CLOUDFLARE_PROJECT_NAME_RESOLVED }}
        run: |
          set -euo pipefail
          log_file=".github/_ci_logs/cloudflare/project-ensure.log"
          project_list="$(npx -y wrangler@4 pages project list 2>&1 | tee "$log_file")"
          if ! printf '%s\n' "$project_list" | grep -Fq "$CLOUDFLARE_PROJECT_NAME_RESOLVED"; then
            echo "Cloudflare Pages project '$CLOUDFLARE_PROJECT_NAME_RESOLVED' not found. Creating..." | tee -a "$log_file"
            if ! npx -y wrangler@4 pages project create "$CLOUDFLARE_PROJECT_NAME_RESOLVED" --production-branch main 2>&1 | tee -a "$log_file"; then
              echo "Failed to create Cloudflare Pages project '$CLOUDFLARE_PROJECT_NAME_RESOLVED'."
              echo "Check token permissions and account/project naming."
              exit 1
            fi
          fi

      - name: Deploy to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME_RESOLVED: ${{ env.CLOUDFLARE_PROJECT_NAME_RESOLVED }}
        run: |
          set -euo pipefail
          log_file=".github/_ci_logs/cloudflare/deploy.log"
          npx -y wrangler@4 pages deploy ALQASEER-PWA/dist --project-name "$CLOUDFLARE_PROJECT_NAME_RESOLVED" --branch "main" 2>&1 | tee "$log_file"
          deploy_url="$(grep -Eo 'https://[a-zA-Z0-9._/-]+\.pages\.dev[^ ]*' "$log_file" | head -n 1 || true)"
          if [ -z "$deploy_url" ]; then
            deploy_url="https://$CLOUDFLARE_PROJECT_NAME_RESOLVED.pages.dev/"
          fi
          echo "DEPLOY_URL=$deploy_url" >> "$GITHUB_ENV"

      - name: Smoke check deployed URL
        shell: bash
        env:
          CLOUDFLARE_PROJECT_NAME_RESOLVED: ${{ env.CLOUDFLARE_PROJECT_NAME_RESOLVED }}
          DEPLOY_URL: ${{ env.DEPLOY_URL }}
        run: |
          set -euo pipefail
          log_file=".github/_ci_logs/cloudflare/smoke.log"
          ROOT_URL="${DEPLOY_URL:-https://$CLOUDFLARE_PROJECT_NAME_RESOLVED.pages.dev/}"
          ROOT_URL="${ROOT_URL%/}/"
          LOGIN_URL="${ROOT_URL%/}/login"
          root_code="$(curl -s -o /dev/null -w "%{http_code}" "$ROOT_URL")"
          login_code="$(curl -s -o /dev/null -w "%{http_code}" "$LOGIN_URL")"
          {
            echo "Deploy URL: $ROOT_URL"
            echo "Root HTTP: $root_code"
            echo "Login HTTP: $login_code"
          } | tee "$log_file"
          if [ "$root_code" -ge 400 ]; then
            echo "Root smoke check failed: $ROOT_URL returned HTTP $root_code"
            exit 1
          fi
          if [ "$login_code" = "404" ]; then
            echo "Login smoke check failed: $LOGIN_URL returned HTTP 404."
            echo "Guidance: ensure ALQASEER-PWA/public/_redirects contains '/* /index.html 200'."
            exit 1
          fi
          if [ "$login_code" -ge 400 ]; then
            echo "Login smoke check failed: $LOGIN_URL returned HTTP $login_code"
            exit 1
          fi
          {
            echo "## Field-Ready Cloudflare Deploy"
            echo ""
            echo "- Result: Success"
            echo "- URL: $ROOT_URL"
            echo "- Smoke / HTTP `/`: $root_code"
            echo "- Smoke / HTTP `/login`: $login_code"
            echo "- Smoke: Passed (`/` and `/login` reachable)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deploy and smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deploy-smoke-logs-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .github/_ci_logs/cloudflare/project-ensure.log
            .github/_ci_logs/cloudflare/deploy.log
            .github/_ci_logs/cloudflare/smoke.log
