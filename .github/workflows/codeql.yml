name: CodeQL

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "python"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  codeql-gate:
    name: CodeQL
    runs-on: ubuntu-latest
    needs: analyze
    if: always()
    steps:
      - name: Fail if CodeQL analyze failed
        run: |
          echo "analyze result = ${{ needs.analyze.result }}"
          test "${{ needs.analyze.result }}" = "success"
