name: Android Emulator Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: |
            ALQASEER-PWA/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
      - name: Install backend deps
        run: python -m pip install -r CRM/backend/requirements.txt
      - name: Install PWA deps
        run: npm ci
        working-directory: ALQASEER-PWA
      - name: Start backend
        shell: bash
        run: |
          repo_root="$(pwd)"
          mkdir -p "$repo_root/docs/_runs/assets"
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > "$repo_root/docs/_runs/assets/backend.log" 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 3
          done
          echo "Backend failed to start" >&2
          exit 1
        working-directory: CRM/backend
      - name: Android emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          script: |
            export DPM_ANDROID_API_BASE_URL="http://10.0.2.2:8000/api/v1"
            export ANDROID_SMOKE_STRICT=1
            pwsh -NoProfile -File scripts/smoke_android_location.ps1
      - name: Upload android smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke
          path: |
            ALQASEER-PWA/android/app/build/outputs/apk/debug/app-debug.apk
            docs/_runs/android_smoke_*.md
            docs/_runs/assets/**
