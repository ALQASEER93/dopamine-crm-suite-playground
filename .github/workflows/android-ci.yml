name: Android - Field Tracker

on:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build + Lint
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          build-root-directory: mobile/field-tracker
          arguments: assembleDebug lintDebug
