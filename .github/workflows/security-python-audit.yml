name: Security - Python Audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r CRM/backend/requirements.txt
          pip install -r CRM/backend/requirements-dev.txt

      - name: Prepare report folder
        run: mkdir -p docs/_runs

      - name: Ruff (JSON)
        run: ruff check CRM/backend --output-format json > docs/_runs/ruff_ci.json

      - name: Bandit (JSON)
        run: bandit -r CRM/backend -c CRM/backend/bandit.yaml -f json -o docs/_runs/bandit_ci.json

      - name: Pip Audit (JSON)
        run: pip-audit -r CRM/backend/requirements.txt -f json -o docs/_runs/pip_audit_ci.json

      - name: Semgrep (JSON)
        run: semgrep --config=auto CRM/backend --json -o docs/_runs/semgrep_ci.json

      - name: Backend Pytest
        run: |
          cd CRM/backend
          python -m pytest -q --junitxml ../../docs/_runs/pytest_ci.xml

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          path: |
            docs/_runs/*_ci.json
            docs/_runs/pytest_ci.xml
