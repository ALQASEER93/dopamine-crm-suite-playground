name: Security - Python Audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r CRM/backend/requirements.txt -r CRM/backend/requirements-dev.txt

      - name: Ruff
        run: ruff check CRM/backend

      - name: Bandit
        run: bandit -r CRM/backend

      - name: Pip Audit
        run: pip-audit -r CRM/backend/requirements.txt

      - name: Semgrep
        run: semgrep --config=auto CRM/backend
