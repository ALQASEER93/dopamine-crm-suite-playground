name: Verify Pack + Android Smoke

on:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pack:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: |
            CRM/frontend/package-lock.json
            CRM/backend/package-lock.json
            ALQASEER-PWA/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: python -m pip install -r CRM/backend/requirements.txt
      - name: Install CRM frontend deps
        run: npm ci
        working-directory: CRM/frontend
      - name: Install CRM backend node deps
        run: npm ci
        working-directory: CRM/backend
      - name: Install PWA deps
        run: npm ci
        working-directory: ALQASEER-PWA
      - name: Verify pack
        run: pwsh -NoProfile -File scripts/verify_pack.ps1
      - name: Upload verify pack report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-pack-report
          path: |
            docs/_runs/verify_pack_*.md
            docs/_runs/assets/**

  android-emulator-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: |
            ALQASEER-PWA/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
      - name: Install backend deps
        run: python -m pip install -r CRM/backend/requirements.txt
      - name: Install PWA deps
        run: npm ci
        working-directory: ALQASEER-PWA
      - name: Start backend
        shell: bash
        run: |
          repo_root="$(pwd)/../.."
          mkdir -p "$repo_root/docs/_runs/assets"
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > "$repo_root/docs/_runs/assets/backend.log" 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 3
          done
          echo "Backend failed to start" >&2
          exit 1
        working-directory: CRM/backend
      - name: Android emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: pwsh -NoProfile -File scripts/smoke_android_location.ps1
      - name: Upload android smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke
          path: |
            docs/_runs/android_smoke_*.md
            docs/_runs/assets/**
