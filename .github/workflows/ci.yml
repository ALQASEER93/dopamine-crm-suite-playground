name: CI

on:
  push:
  pull_request:
  merge_group:
    branches:
      - main

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest
      - name: Validate GitHub workflows
        run: ./actionlint -color

  ai-orchestrator:
    name: AI Orchestrator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: |
            AI-Orchestrator/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: AI-Orchestrator
      - name: NPM Prod Audit Gate
        run: node ../scripts/npm_prod_audit_gate.mjs .
        working-directory: AI-Orchestrator
      - name: Build
        run: npm run build --if-present
        working-directory: AI-Orchestrator
      - name: Test
        run: npm test --if-present
        working-directory: AI-Orchestrator

  backend:
    name: CRM Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: |
            CRM/backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install node deps
        run: npm ci
        working-directory: CRM/backend
      - name: NPM Prod Audit Gate
        run: node ../../scripts/npm_prod_audit_gate.mjs .
        working-directory: CRM/backend
      - name: Install python deps
        run: python -m pip install -r requirements.txt
        working-directory: CRM/backend
      - name: Pytest
        run: python -m pytest -q
        working-directory: CRM/backend

  crm-frontend:
    name: CRM Frontend (Vite/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: |
            CRM/frontend/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: CRM/frontend
      - name: NPM Prod Audit Gate
        run: node ../../scripts/npm_prod_audit_gate.mjs .
        working-directory: CRM/frontend
      - name: Build
        run: npm run build
        working-directory: CRM/frontend
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1

  pwa:
    name: ALQASEER PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: |
            ALQASEER-PWA/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: ALQASEER-PWA
      - name: NPM Prod Audit Gate
        run: node ../scripts/npm_prod_audit_gate.mjs .
        working-directory: ALQASEER-PWA
      - name: Lint
        run: npm run lint
        working-directory: ALQASEER-PWA
      - name: Build
        run: npm run build
        working-directory: ALQASEER-PWA
