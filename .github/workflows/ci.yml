name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number for DPM Review Bridge comment posting"
        required: false
        type: string
  merge_group:
    branches:
      - main

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest
      - name: Validate GitHub workflows
        run: ./actionlint -color

  dpm-review-bridge:
    name: DPM Review Bridge
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout PR/head code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Fetch PR base for changed-file summary
        if: github.event_name == 'pull_request' && github.base_ref != ''
        run: git fetch --no-tags origin "${{ github.base_ref }}" --depth=50

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create DPM Review Bridge bundle
        id: bundle
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          ARTIFACT_NAME: dpm-review-bridge-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/dpm/create-review-bridge-bundle.mjs | tee bridge-result.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('bridge-result.json','utf8')); for (const [k,v] of Object.entries({run_id:r.runId,zip_path:r.zipPath,verdict:r.verdict})) console.log(k+'='+v)" >> "$GITHUB_OUTPUT"

      - name: Upload DPM Review Bridge artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: dpm-review-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.bundle.outputs.zip_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Post or update PR handoff comment
        if: (github.event_name == 'pull_request' || inputs.pr_number != '') && steps.bundle.outputs.run_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          RUN_ID: ${{ steps.bundle.outputs.run_id }}
          ARTIFACT_NAME: dpm-review-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/dpm/post-review-bridge-comment.mjs

      - name: Write GitHub step summary
        if: always()
        env:
          RUN_ID: ${{ steps.bundle.outputs.run_id }}
          VERDICT: ${{ steps.bundle.outputs.verdict }}
          ARTIFACT_NAME: dpm-review-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "# DPM Review Bridge"
            echo ""
            echo "- Repo: ${{ github.repository }}"
            echo "- PR: ${PR_NUMBER:-unavailable}"
            echo "- Commit: ${COMMIT_SHA}"
            echo "- Run ID: ${RUN_ID:-unavailable}"
            echo "- Verdict: ${VERDICT:-unavailable}"
            echo "- Workflow Run: ${WORKFLOW_RUN_URL}"
            echo "- Artifact: ${ARTIFACT_NAME}"
            echo "- Artifact ID: ${ARTIFACT_ID:-unavailable}"
            echo ""
            echo "## Copy this to ChatGPT"
            echo '```text'
            echo "راجع DPM Review Bridge:"
            echo "Repo: ${{ github.repository }}"
            echo "PR: ${PR_NUMBER:-unavailable}"
            echo "Run ID: ${RUN_ID:-unavailable}"
            echo "Verdict: ${VERDICT:-unavailable}"
            echo "Commit: ${COMMIT_SHA}"
            echo "Workflow Run: ${WORKFLOW_RUN_URL}"
            echo "Artifact: ${ARTIFACT_NAME}"
            echo "Artifact ID: ${ARTIFACT_ID:-unavailable}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ai-orchestrator:
    name: AI Orchestrator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: |
            AI-Orchestrator/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: AI-Orchestrator
      - name: Build
        run: npm run build --if-present
        working-directory: AI-Orchestrator
      - name: Test
        run: npm test --if-present
        working-directory: AI-Orchestrator

  backend:
    name: CRM Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: |
            CRM/backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install node deps
        run: npm ci
        working-directory: CRM/backend
      - name: Install python deps
        run: python -m pip install -r requirements.txt
        working-directory: CRM/backend
      - name: Pytest
        run: python -m pytest -q
        working-directory: CRM/backend

  crm-frontend:
    name: CRM Frontend (Vite/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            CRM/frontend/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: CRM/frontend
      - name: NPM Prod Audit Gate
        run: node ../../scripts/npm_prod_audit_gate.mjs .
        working-directory: CRM/frontend
      - name: Build
        run: npm run build
        working-directory: CRM/frontend
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1

  pwa:
    name: ALQASEER PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            ALQASEER-PWA/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: ALQASEER-PWA
      - name: NPM Prod Audit Gate
        run: node ../scripts/npm_prod_audit_gate.mjs .
        working-directory: ALQASEER-PWA
      - name: Lint
        run: npm run lint
        working-directory: ALQASEER-PWA
      - name: Build
        run: npm run build
        working-directory: ALQASEER-PWA
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1
