name: DPM Review Bridge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number for PR comment posting"
        required: false
        type: string
  pull_request:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  bridge:
    name: Build review bridge artifact
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/dpm-review-bridge') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR context
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            let prNumber = "";
            let checkoutRef = context.ref;
            let headSha = context.sha;
            let headRef = context.ref.replace("refs/heads/", "");
            let baseRef = "";
            let shouldPostComment = false;

            if (eventName === "pull_request") {
              prNumber = String(context.payload.pull_request.number);
              checkoutRef = context.payload.pull_request.head.sha;
              headSha = context.payload.pull_request.head.sha;
              headRef = context.payload.pull_request.head.ref;
              baseRef = context.payload.pull_request.base.ref;
              shouldPostComment = true;
            } else if (eventName === "issue_comment") {
              prNumber = String(context.payload.issue.number);
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(prNumber),
              });
              if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.setFailed("Refusing issue_comment bridge checkout for forked PR head.");
                return;
              }
              checkoutRef = pr.head.sha;
              headSha = pr.head.sha;
              headRef = pr.head.ref;
              baseRef = pr.base.ref;
              shouldPostComment = true;
            } else if (eventName === "workflow_dispatch") {
              prNumber = core.getInput("pr_number") || "";
              shouldPostComment = Boolean(prNumber);
            }

            core.setOutput("pr_number", prNumber);
            core.setOutput("checkout_ref", checkoutRef);
            core.setOutput("head_sha", headSha);
            core.setOutput("head_ref", headRef);
            core.setOutput("base_ref", baseRef);
            core.setOutput("should_post_comment", String(shouldPostComment));

      - name: Checkout target code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.checkout_ref }}
          fetch-depth: 50

      - name: Fetch PR base for changed-file summary
        if: steps.ctx.outputs.base_ref != ''
        run: git fetch --no-tags origin "${{ steps.ctx.outputs.base_ref }}" --depth=50

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create DPM Review Bridge bundle
        id: bundle
        env:
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          HEAD_REF: ${{ steps.ctx.outputs.head_ref }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          PR_BASE_REF: ${{ steps.ctx.outputs.base_ref }}
          ARTIFACT_NAME: dpm-review-bridge-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/dpm/create-review-bridge-bundle.mjs | tee bridge-result.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('bridge-result.json','utf8')); for (const [k,v] of Object.entries({run_id:r.runId,zip_path:r.zipPath,verdict:r.verdict})) console.log(k+'='+v)" >> "$GITHUB_OUTPUT"

      - name: Upload DPM Review Bridge artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: dpm-review-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.bundle.outputs.zip_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Post or update PR handoff comment
        if: steps.ctx.outputs.should_post_comment == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          RUN_ID: ${{ steps.bundle.outputs.run_id }}
          ARTIFACT_NAME: dpm-review-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/dpm/post-review-bridge-comment.mjs

      - name: Warn when PR number is unavailable
        if: steps.ctx.outputs.should_post_comment != 'true'
        run: echo "PR number unavailable; artifact was created but PR comment posting was skipped."
