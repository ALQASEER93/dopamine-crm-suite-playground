name: Ruleset Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  administration: read

jobs:
  ruleset-guard:
    name: ruleset-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run ruleset guard
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: node scripts/ruleset-guard.mjs

      - name: Publish ruleset-guard summary
        if: always()
        run: |
          echo "## Ruleset Guard (always-on report)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/ruleset-guard/summary.md ]; then
            cat artifacts/ruleset-guard/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No summary file found at artifacts/ruleset-guard/summary.md_" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ruleset-guard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruleset-guard-report
          path: artifacts/ruleset-guard/**
          if-no-files-found: warn
