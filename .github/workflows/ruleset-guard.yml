name: Ruleset Guard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  ruleset-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Ruleset Guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ruleset-guard.mjs

      - name: Zip Latest Run
        run: |
          latest_dir=$(ls -1dt docs/_runs/run_* 2>/dev/null | head -n 1)
          if [ -z "$latest_dir" ]; then
            echo "No run directory found."
            exit 1
          fi
          zip -r "docs/_runs/$(basename "$latest_dir").zip" "$latest_dir"

      - name: Upload Runs
        uses: actions/upload-artifact@v4
        with:
          name: ruleset-guard-runs
          path: docs/_runs/**
